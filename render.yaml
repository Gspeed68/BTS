services:
  - type: web
    name: bts-client-forms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bts-forms-db
          property: connectionString

databases:
  - name: bts-forms-db
    databaseName: bts_forms
    user: bts
